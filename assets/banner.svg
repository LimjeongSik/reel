<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
  <title id="title">reel</title>
  <desc id="desc">커밋이 이어진 필름 스트립에서 명장면 세 컷을 골라 이력서와 포트폴리오로 엮는 Claude Code 플러그인</desc>
  <style>
    text { font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif; fill: #1F2730; }
    .title { font-size: 76px; font-weight: 800; letter-spacing: -2.5px; }
    .lede { font-size: 23px; font-weight: 500; fill: #46525E; }
    .hash { font-family: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; font-size: 13px; font-weight: 500; fill: #8C98A4; }
        .case { font-family: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; font-size: 15px; font-weight: 700; fill: #D2543A; }
    .stage { font-size: 19px; font-weight: 700; }
    .skill { font-size: 16px; font-weight: 500; fill: #66727E; }
    .arrow { font-size: 18px; fill: #A3ADB7; }
  </style>

  <rect width="1280" height="440" fill="#ECEEF0"/>

  <text x="72" y="118" class="title">reel</text>
  <text x="76" y="162" class="lede">커밋 수백 개에서 명장면만 골라 이력서와 포트폴리오로 엮는 Claude Code 플러그인.</text>

